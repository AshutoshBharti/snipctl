[package]
name = "snipctl"
version = "1.0.0"
edition = "2021"
description = "Universal CLI Snippet Manager — capture, search, and reuse commands from any CLI"
license = "MIT"
keywords = ["cli", "snippet", "azure", "aws", "gcloud"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
crossterm = "0.28"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
atty = "0.2"

[dev-dependencies]
tempfile = "3"
